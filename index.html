<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coisas para Internet</title>
<style>
  :root { --papel: #F4EAD5; --cartao: #FFFAEE; --tinta: #1F2A4A; --suave: #56617F; --linha: #C2A877; }
  @media (prefers-color-scheme: dark) {
    :root { --papel: #1F2A4A; --cartao: #2A365A; --tinta: #F4EAD5; --suave: #C9CFDD; --linha: #56617F; }
  }
  body { margin: 0; background: var(--papel); color: var(--tinta);
         font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.8em; margin: 0 0 8px; }
  p { color: var(--suave); margin: 0 0 32px; }
  a.app { display: flex; gap: 16px; align-items: center; padding: 16px; border: 1px solid var(--linha);
          border-radius: 12px; background: var(--cartao); color: inherit; text-decoration: none; }
  a.app img { width: 64px; height: 64px; border-radius: 14px; image-rendering: pixelated; }
  a.app strong { display: block; font-size: 1.1em; }
  a.app span { color: var(--suave); }
</style>
</head>
<body>
<main>
<h1>Coisas para Internet</h1>
<p>Jogos e apps pequenos, feitos no Brasil.</p>
<a class="app" href="/postais/">
  <img src="/postais/icone.png" alt="">
  <div><strong>Postais</strong><span>Palavras cruzadas de viagem para Android</span></div>
</a>
</main>
</body>
</html>
